# Servo Mapping Reference:
# - left_arm: Channel 0
# - right_arm: Channel 1
# - head_yaw: Channel 2
# - head_pitch: Channel 3
# - left_eye: Channel 4
# - right_eye: Channel 5

actions:
  1:
    name: "wave"
    sequence:
      - angles: {right_arm: 30}
        duration: 0.3
      - angles: {right_arm: 150}
        duration: 0.3
      - angles: {right_arm: 30}
        duration: 0.3
      - angles: {right_arm: 90}
        duration: 0.2

  2:
    name: "blink"
    sequence:
      - angles: {left_eye: 180, right_eye: 180}
        duration: 0.1
      - angles: {left_eye: 0, right_eye: 0}
        duration: 0.1

  3:
    name: "nod"
    sequence:
      - angles: {head_pitch: 70}
        duration: 0.2
      - angles: {head_pitch: 110}
        duration: 0.2
      - angles: {head_pitch: 90}
        duration: 0.2

  4:
    name: "head_tilt_left"
    sequence:
      - angles: {head_yaw: 60}
        duration: 0.3
      - angles: {head_yaw: 90}
        duration: 0.3

  5:
    name: "head_tilt_right"
    sequence:
      - angles: {head_yaw: 120}
        duration: 0.3
      - angles: {head_yaw: 90}
        duration: 0.3

  6:
    name: "both_arms_up"
    sequence:
      - angles: {left_arm: 160, right_arm: 160}
        duration: 0.4
      - angles: {left_arm: 90, right_arm: 90}
        duration: 0.4

  7:
    name: "delayed_two_arm_raise"
    sequence:
      - angles: {right_arm: 150}
        duration: 0.25
      - angles: {left_arm: 150}
        duration: 0.25
      - angles: {right_arm: 90, left_arm: 90}
        duration: 0.3

  8:
    name: "right_arm_raise"
    sequence:
      - angles: {right_arm: 150}
        duration: 0.3
      - angles: {right_arm: 90}
        duration: 0.3

  9:
    name: "left_arm_raise"
    sequence:
      - angles: {left_arm: 150}
        duration: 0.3
      - angles: {left_arm: 90}
        duration: 0.3

  10:
    name: "head_shake"
    sequence:
      - angles: {head_yaw: 60}
        duration: 0.15
      - angles: {head_yaw: 120}
        duration: 0.3
      - angles: {head_yaw: 90}
        duration: 0.15